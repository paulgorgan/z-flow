<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z-FLOW — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .icon {
      width: 56px; height: 56px;
      background: #f1f5f9;
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.125rem; font-weight: 800; color: #1e293b; margin-bottom: .5rem; }
    p  { font-size: .875rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: .75rem;
      padding: .75rem 1.5rem;
      font-size: .875rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background .2s;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5A2.25 2.25 0 015.25 14.25h13.5A2.25 2.25 0 0121 16.5v.75A2.25 2.25 0
          0118.75 19.5H5.25A2.25 2.25 0 013 17.25v-.75zM8.25 11.25V6a3.75 3.75 0 017.5 0v5.25M6
          11.25h12"/>
      </svg>
    </div>
    <h1>Ești offline</h1>
    <p>Nu am putut conecta la server. Verifică conexiunea la internet și încearcă din nou.</p>
    <button onclick="location.reload()">Reîncearcă</button>
  </div>
</body>
</html>
